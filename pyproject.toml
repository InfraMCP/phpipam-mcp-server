[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phpipam-mcp-server"
version = "0.3.0"
description = "MCP server for phpIPAM IP address management and network infrastructure"
authors = [{name = "Rory McMahon", email = "rory.mcmahon@vocus.com.au"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # mcp is held on the latest 1.x release: 2.x renames FastMCP to MCPServer
    # and removes mcp.server.fastmcp, which this server imports. Moving to 2.x
    # is a separate, breaking migration.
    "mcp==1.27.2",
    "requests==2.34.2",
    "uvicorn[standard]>=0.34",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["mcp", "phpipam", "ipam", "network", "ip-management"]

[project.urls]
Homepage = "https://github.com/InfraMCP/phpipam-mcp-server"
Repository = "https://github.com/InfraMCP/phpipam-mcp-server"
Issues = "https://github.com/InfraMCP/phpipam-mcp-server/issues"
Documentation = "https://github.com/InfraMCP/phpipam-mcp-server#readme"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "black==26.5.1",
    # isort held at 5.13.2: the 9.x line scores poorly on Socket's supply-chain
    # signal (recently published, low adoption). 5.13.2 is mature and widely used.
    "isort==5.13.2",
    "mypy>=1.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
    "pylint>=3.0.0",
]
security = [
    "safety>=3.0.0",
    "pip-audit>=2.6.0",
]

[project.scripts]
phpipam-mcp-server = "phpipam_mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pylint.messages_control]
disable = ["C0114", "C0116", "R0903"]
